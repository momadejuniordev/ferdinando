<!DOCTYPE html>
<html lang="en">

<head>
    <title>Nathan — Personal Portfolio Website</title>
    <link rel="icon" href="images/icon.webp" type="image/gif" sizes="16x16">
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="description">
    <meta content="" name="keywords">
    <meta content="" name="author">

    <!-- CSS Files ================================================== -->
    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" id="bootstrap">
    <link href="css/plugins.css" rel="stylesheet" type="text/css">
    <link href="css/style.css" rel="stylesheet" type="text/css">
    <link href="css/coloring.css" rel="stylesheet" type="text/css">
    <link id="colors" href="css/colors/scheme-01.css" rel="stylesheet" type="text/css">
</head>

<body class="dark-scheme">
    <div id="wrapper">
        <div class="float-text show-on-scroll">
            <span><a href="#">Scroll to top</a></span>
        </div>
        <div class="scrollbar-v show-on-scroll"></div>

        <!-- page preloader -->
        <div id="de-loader"></div>

        <!-- content begin -->
        <div class="section-dark no-bottom no-top" id="content">
            <div id="top"></div>

            <section class="no-top">
                <!-- Menu -->
                <div id="menu"></div>
            </section>

            <section class="no-top">
                <div class="container">
                    <div id="projects-row" class="row g-4 wow fadeInUp" data-wow-delay=".3s">
                        <!-- Projetos carregados dinamicamente -->
                    </div>
                </div>
            </section>
        </div>
        <!-- content close -->

        <!-- footer begin -->
        <footer>
            <div class="container-fluid">
                <div class="px-2">
                    <div class="row g-4 align-items-center">
                        <div class="col-lg-6">
                            <div class="d-menu-1 wow" data-wow-delay=".3s">
                                <ul>
                                    <li><a href="#">Facebook</a></li>
                                    <li><a href="#">Twitter</a></li>
                                    <li><a href="#">Instagram</a></li>
                                </ul>
                                <p class="no-bottom">All Right Reserved<br>Template By Designesia</p>
                            </div>
                        </div>

                        <div class="col-lg-6 text-lg-end">
                            <a href="contact.html">
                                <h2 class="fs-84 fw-800 pe-3 shuffle wow fadeInLeft" data-wow-delay=".3s">Let's Talk</h2>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
        <!-- footer close -->
    </div>

    <!-- Javascript Files ================================================== -->
    <script src="js/plugins.js"></script>
    <script src="js/designesia.js"></script>
    <script src="js/menu.js"></script>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Script para carregar projetos dinamicamente -->
    <script>
        // Substitui pelos teus dados do Supabase
        const SUPABASE_URL = "https://lkfmtfihkbkjhigrajwb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrZm10Zmloa2JramhpZ3JhandiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5MDIxOTgsImV4cCI6MjA3ODQ3ODE5OH0.J07lM8E3CsMwvbnDXxeXvTboL46-jqa00jDKTJ2mKHM";

        // Inicializa Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadProjects() {
            const { data, error } = await supabase
                .from("projects")
                .select("*")
                .order("year", { ascending: false });

            if (error) {
                console.error("Erro ao carregar projetos:", error);
                return;
            }

            const container = document.getElementById("projects-row");

            // Renderiza os projetos usando map()
            container.innerHTML = data.map(project => `
                <div class="col-lg-4">
                    <div class="hover relative overflow-hidden text-light">
                        <a href="work-single.html?id=${project.id}" class="overflow-hidden d-block relative">
                            <h2 class="fs-40 abs-centered z-index-1 hover-op-0">${project.title}</h2>
                            <img src="${project.image_url}" class="img-fluid hover-scale-1-2" alt="${project.title}">
                            <div class="absolute bottom-0 w-100 p-4 d-flex text-white justify-content-between">
                                <div class="d-tag-s2">${project.category}</div>
                                <div class="fw-bold">${project.year}</div>
                            </div>
                        </a>
                    </div>
                </div>
            `).join("");
        }

        document.addEventListener("DOMContentLoaded", loadProjects);
    </script>
</body>

</html>
